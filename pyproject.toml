[project]
name = "hiec-game"
version = "0.1.0"
description = "Human-in-the-loop Evolutionary Computation game (CPPN abstract art)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "qrcode>=7.4",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
