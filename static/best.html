<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ベスト</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #fff; color: #000;
    font-family: "Meiryo", "メイリオ", sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  .top { display: flex; justify-content: flex-end; gap: 1.5em; padding: 12px 16px; font-size: 1rem; }
  .top b { font-variant-numeric: tabular-nums; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding-bottom: 48px; }
  #art {
    display: block; width: min(70vw, 320px); height: auto; aspect-ratio: 1;
    image-rendering: pixelated; outline: 1px solid #000;
  }
</style>
</head>
<body>
<div class="top"><span>選択数 <b id="total">0</b></span><span>第 <b id="gen">0</b> 世代</span></div>
<div class="stage"><canvas id="art" width="16" height="16"></canvas></div>
<script src="/static/pixel.js"></script>
<script src="/static/best.js"></script>
</body>
</html>
