<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>どれがいい？</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #fff; color: #000;
    font-family: "Meiryo", "メイリオ", sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  .top { display: flex; justify-content: flex-end; gap: 1.5em; padding: 12px 16px; font-size: 1rem; }
  .top b { font-variant-numeric: tabular-nums; }
  .topic { text-align: center; font-size: clamp(1.4rem, 4vw, 2.4rem); font-weight: bold; margin: 0 16px 16px; }
  .grid {
    display: grid; gap: clamp(6px, 1.5vw, 14px); margin: 0 auto 16px;
    width: min(94vw, calc(100vh - 170px));
  }
  .grid canvas {
    display: block; width: 100%; height: auto; aspect-ratio: 1;
    image-rendering: pixelated; cursor: pointer;
    outline: 1px solid #000; outline-offset: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .grid canvas.cur { outline: 4px solid #000; outline-offset: 3px; }
  .grid.busy canvas { pointer-events: none; opacity: .4; }
  .msg { text-align: center; min-height: 1.5em; padding-bottom: 12px; font-size: .9rem; }
</style>
</head>
<body>
<div class="top"><span>選択数 <b id="total">0</b></span><span>第 <b id="gen">0</b> 世代</span></div>
<div class="topic" id="topic"></div>
<div class="grid" id="grid"></div>
<div class="msg" id="msg"></div>

<script src="/static/pixel.js"></script>
<script src="/static/client.js"></script>
</body>
</html>
